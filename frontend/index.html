<!DOCTYPE html>
<html lang="uk">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Облік витрат</title>
  <style>
    body { font-family: sans-serif; max-width: 600px; margin: 2rem auto; padding: 0 1rem; }
    form { display: flex; gap: 0.5rem; flex-wrap: wrap; margin-bottom: 1rem; }
    input, button { padding: 0.4rem; }
    li { display: flex; justify-content: space-between; padding: .5rem 0; border-bottom: 1px solid #ddd; }
  </style>
</head>
<body>
  <h1>Мої витрати</h1>
  <form id="form">
    <input id="date" type="date" required>
    <input id="category" placeholder="Категорія (напр. Їжа)" required>
    <input id="amount" type="number" step="0.01" placeholder="Сума" required>
    <input id="note" placeholder="Коментар">
    <button type="submit">Додати</button>
  </form>
  <p id="status"></p>
  <ul id="list"></ul>

  <script>
    const API = "https://myproject-jypu.onrender.com";

    async function load() {
      const response = await fetch(API + "/items");
      const items = await response.json();
      const list = document.getElementById("list");
      list.innerHTML = "";
      for (const item of items) {
        const li = document.createElement("li");
        li.textContent = `${item.date} | ${item.category} | ${item.amount} грн ${item.note ? '(' + item.note + ')' : ''}`;
        list.appendChild(li);
      }
    }

    document.getElementById("form").addEventListener("submit", async (event) => {
      event.preventDefault();
      const body = {
        date: document.getElementById("date").value,
        category: document.getElementById("category").value,
        amount: document.getElementById("amount").value,
        note: document.getElementById("note").value,
      };
      const response = await fetch(API + "/items", {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify(body),
      });
      const result = await response.json();
      document.getElementById("status").textContent =
        response.ok ? "Витрату додано!" : "Помилка: " + (result.error || "невідома помилка");
      if (response.ok) {
        event.target.reset();
        load();
      }
    });

    load();
  </script>
</body>
</html>
